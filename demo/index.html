<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Station Card demo</title>
<style>body{margin:0;padding:24px;background:#111214;color:#e3e5e7;font:14px Arial,sans-serif}main{max-width:1120px;margin:auto}h1{font-size:16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{background:#252527;border:1px solid #45474a;color:inherit;border-radius:6px;padding:8px 12px;cursor:pointer}weather-station-card{--ha-card-background:#1c1c1e;--primary-text-color:#e3e5e7;--secondary-text-color:#a3a6aa;--secondary-background-color:#252527;--divider-color:#35373a;--info-color:#4aa9e7}#card-wrap{max-width:480px}.caption{color:#a3a6aa;font-size:12px}pre{white-space:pre-wrap;font-size:12px}</style>
<main><h1>Weather Station Card</h1><p class="caption">Synthetic demo readings · no Home Assistant connection</p><nav><button id="all">All sensors</button><button id="rain">Rain only</button><button id="wind">Wind only</button><button id="empty">No sensors</button><button id="unavailable">Unavailable</button><button id="units">Alternate units</button><button id="checks">Run checks</button></nav><div id="card-wrap"><weather-station-card></weather-station-card></div><pre id="results" role="status"></pre></main>
<script type="module" src="demo.js"></script></html>
